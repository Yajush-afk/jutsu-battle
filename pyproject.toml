[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jutsu-battle"
version = "0.0.1"
description = "Offline computer-vision hand-seal battle game"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
  { name = "Yajush-afk" },
]

[project.scripts]
jutsu-capture-numbers = "jutsu_battle.number_identifier.capture:main"
jutsu-build-number-dataset = "jutsu_battle.number_identifier.dataset:main"
jutsu-train-numbers = "jutsu_battle.number_identifier.train:main"
jutsu-compare-numbers = "jutsu_battle.number_identifier.compare:main"
jutsu-evaluate-numbers = "jutsu_battle.number_identifier.evaluate:main"
jutsu-number-app = "jutsu_battle.number_identifier.app:main"
jutsu-release-number = "jutsu_battle.number_identifier.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jutsu_battle"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["jutsu_battle"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "mediapipe",
  "mediapipe.*",
  "seaborn",
  "seaborn.*",
  "sklearn",
  "sklearn.*",
  "torchvision",
  "torchvision.*",
]
ignore_missing_imports = true

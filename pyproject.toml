[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jutsu-battle"
version = "0.0.1"
description = "Offline computer-vision hand-seal battle game"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
  { name = "Yajush-afk" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jutsu_battle"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["jutsu_battle"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true
